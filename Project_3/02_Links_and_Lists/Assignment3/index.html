<!DOCTYPE html>
<html>
<head>
    <title>Link Background Colors</title>

    <style>
        a:link {
            background-color: #FF0000;
        }

        a:visited {
            background-color: #FFFF00;
        }

        a:hover {
            background-color: #FF00FF;
        }

        a:active {
            background-color: #0000FF;
        }
    </style>
</head>

<body>

    <h1>Link Background Color Example</h1>

    <a href="https://www.google.com" target="_blank">
        Visit Google
    </a>

</body>
</html>
