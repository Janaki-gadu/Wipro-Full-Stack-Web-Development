<!DOCTYPE html>
<html>
<head>
    <title>Different Text Colors</title>

    <style>
        h1 {
            color: red;
        }

        h2 {
            color: blue;
        }

        p {
            color: green;
        }

        div {
            color: purple;
        }
    </style>
</head>

<body>

    <h1>Welcome to CSS</h1>

    <h2>Text Color Example</h2>

    <p>
        This paragraph is displayed in green color.
    </p>

    <div>
        This div element is displayed in purple color.
    </div>

</body>
</html>
