<!DOCTYPE html>
<html>
<head>
    <title>Repeating Background Image</title>

    <style>
        body {
            background-image: url("background.jpg");
            background-repeat: repeat;
            background-size: 200px 200px;
        }
    </style>
</head>

<body>

    <h1>Repeating Background Image</h1>

    <p>
        This webpage displays a 200 x 200 pixel image
        repeated across the page.
    </p>

</body>
</html>
