<!DOCTYPE html>
<html>
<head>
    <title>CSS3 Scale</title>

    <style>
        div {
            width: 150px;
            height: 100px;
            background-color: lightblue;
            border: 1px solid black;
            transform: scale(2, 3);
        }
    </style>
</head>

<body>

    <div>
        Scaled Element
    </div>

</body>
</html>
