<!DOCTYPE html>
<html>
<head>
    <title>CSS3 Image Border</title>

    <style>
        div {
            border: 15px solid;
            padding: 20px;
            border-image: url("border.png") 30 30 stretch;
        }
    </style>
</head>

<body>

    <div>
        This element has an image border.
    </div>

</body>
</html>
