<!DOCTYPE html>
<html>
<head>
    <title>CSS3 Rotation</title>

    <style>
        div {
            width: 250px;
            padding: 20px;
            background-color: lightblue;
            transform: rotate(-20deg);
        }
    </style>
</head>

<body>

    <div>
        This div is rotated counter-clockwise by 20 degrees.
    </div>

</body>
</html>
