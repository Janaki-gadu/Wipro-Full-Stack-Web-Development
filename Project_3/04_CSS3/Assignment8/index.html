<!DOCTYPE html>
<html>
<head>
    <title>CSS3 Skew</title>

    <style>
        div {
            width: 200px;
            height: 100px;
            background-color: yellow;
            border: 1px solid black;
            transform: skew(20deg, 10deg);
        }
    </style>
</head>

<body>

    <div>
        Skewed Element
    </div>

</body>
</html>
