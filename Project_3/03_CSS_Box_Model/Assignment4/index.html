<!DOCTYPE html>
<html>
<head>
    <title>Different Margin Properties</title>

    <style>
        .first {
            margin-top: 3cm;
            margin-bottom: 5cm;
        }

        .second {
            margin-left: 2cm;
        }

        .third {
            margin-top: 25%;
        }
    </style>
</head>

<body>

    <p class="first">
        This is the first paragraph.
        It has a top margin of 3cm and a bottom margin of 5cm.
    </p>

    <p class="second">
        This is the second paragraph.
        It has a left margin of 2cm.
    </p>

    <p class="third">
        This is the third paragraph.
        It has a top margin of 25%.
    </p>

</body>
</html>
