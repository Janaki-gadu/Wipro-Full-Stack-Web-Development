<!DOCTYPE html>
<html>
<head>
    <title>Padding Properties</title>

    <style>
        .first {
            padding-left: 3cm;
        }

        .second {
            padding-right: 50%;
        }

        .third {
            padding-bottom: 25%;
        }

        .fourth {
            padding-top: 25%;
        }
    </style>
</head>

<body>

    <p class="first">
        This is the first paragraph with 3cm left padding.
    </p>

    <p class="second">
        This is the second paragraph with 50% right padding.
    </p>

    <p class="third">
        This is the third paragraph with 25% bottom padding.
    </p>

    <p class="fourth">
        This is the fourth paragraph with 25% top padding.
    </p>

</body>
</html>
