<!DOCTYPE html>
<html>
<head>
    <title>Paragraph Width</title>

    <style>
        p {
            width: 250px;
            border: 1px solid black;
        }
    </style>
</head>

<body>

    <p>
        This paragraph has a total width of 250 pixels.
        CSS box model controls the width of this paragraph.
    </p>

</body>
</html>
