<!DOCTYPE html>
<html>
<head>
    <title>Food Calories</title>

    <link rel="stylesheet"
          href="../bootstrap/css/bootstrap.min.css">

    <style>
        .green {
            background-color: lightgreen;
        }

        .blue {
            background-color: lightblue;
        }

        .orange {
            background-color: #ffd580;
        }

        .red {
            background-color: lightcoral;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Food Calorie Table</h2>

        <table class="table table-striped">

            <thead>
                <tr>
                    <th>Food</th>
                    <th>Calories</th>
                </tr>
            </thead>

            <tbody>

                <tr class="green">
                    <td>Apple</td>
                    <td>95</td>
                </tr>

                <tr class="green">
                    <td>Rice</td>
                    <td>250</td>
                </tr>

                <tr class="blue">
                    <td>Pizza</td>
                    <td>500</td>
                </tr>

                <tr class="orange">
                    <td>Burger</td>
                    <td>900</td>
                </tr>

                <tr class="red">
                    <td>Large Cake</td>
                    <td>1500</td>
                </tr>

            </tbody>

        </table>

    </div>

</body>
</html>
