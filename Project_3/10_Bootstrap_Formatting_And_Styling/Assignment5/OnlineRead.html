<!DOCTYPE html>
<html>
<head>
    <title>OnlineRead</title>

    <link rel="stylesheet"
          href="../bootstrap/css/bootstrap.min.css">

    <style>
        .book-button {
            margin: 5px;
            width: 130px;
        }

        .all {
            background-color: white;
            color: black;
        }

        .kids {
            background-color: darkblue;
            color: white;
        }

        .teens {
            background-color: green;
            color: white;
        }

        .scientific {
            background-color: lightblue;
            color: black;
        }

        .crime {
            background-color: orange;
            color: black;
        }

        .horror {
            background-color: red;
            color: white;
        }

        .feedback {
            margin-top: 20px;
        }

        .font-buttons {
            margin-top: 10px;
        }

        .big {
            font-size: 28px;
        }

        .medium-big {
            font-size: 24px;
        }

        .medium {
            font-size: 20px;
        }

        .small {
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>OnlineRead</h1>

        <h3>Book Types</h3>

        <button class="btn book-button all">All</button>
        <button class="btn book-button kids">Kids</button>
        <button class="btn book-button teens">Teens</button>
        <button class="btn book-button scientific">Scientific</button>
        <button class="btn book-button crime">Crime</button>
        <button class="btn book-button horror">Horror</button>

        <div class="feedback">
            <button class="btn btn-primary">Feedback</button>
        </div>

        <div class="font-buttons">
            <button class="btn big">Big</button>
            <button class="btn medium-big">Medium Big</button>
            <button class="btn medium">Medium</button>
            <button class="btn small">Small</button>
        </div>

    </div>

</body>
</html>
