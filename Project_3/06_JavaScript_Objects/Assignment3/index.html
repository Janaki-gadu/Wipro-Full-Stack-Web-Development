<!DOCTYPE html>
<html>
<head>
    <title>Remove Characters</title>
</head>

<body>

    <script>
        function removeCharacters(str, count) {
            return str.substring(count);
        }

        let text = "JavaScript";

        document.write("Original String: " + text + "<br>");
        document.write("After Removing 4 Characters: "
            + removeCharacters(text, 4));
    </script>

</body>
</html>
