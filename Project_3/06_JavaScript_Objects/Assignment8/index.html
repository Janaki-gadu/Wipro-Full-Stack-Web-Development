<!DOCTYPE html>
<html>
<head>
    <title>Odd or Even</title>
</head>

<body>

    <script>
        let number = Number(prompt("Enter a number:"));

        if (number % 2 === 0) {
            alert(number + " is Even");
        } else {
            alert(number + " is Odd");
        }
    </script>

</body>
</html>
