<!DOCTYPE html>
<html>
<head>
    <title>Ordered and Unordered Lists</title>
</head>

<body>

    <h2>My Favorite Subjects</h2>

    <h3>Ordered List</h3>

    <ol>
        <li>Java</li>
        <li>HTML</li>
        <li>CSS</li>
        <li>SQL</li>
        <li>Python</li>
    </ol>

    <h3>Unordered List</h3>

    <ul>
        <li>Cricket</li>
        <li>Music</li>
        <li>Reading</li>
        <li>Travel</li>
        <li>Photography</li>
    </ul>

</body>
</html>
