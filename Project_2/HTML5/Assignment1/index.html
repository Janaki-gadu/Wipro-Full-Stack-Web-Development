<!DOCTYPE html>
<html>
<head>
    <title>HTML5 Forms</title>
</head>

<body>

    <h1>Visitors Information</h1>

    <hr>

    <form>

        <table>

            <tr>
                <td>Email Address:</td>
                <td>
                    <input type="email"
                           name="email"
                           placeholder="Enter your email"
                           required>
                </td>
            </tr>

            <tr>
                <td>User's Interest:</td>
                <td>
                    <input type="checkbox"
                           name="interest"
                           value="research">
                    Research

                    <input type="checkbox"
                           name="interest"
                           value="purchase">
                    Purchase
                </td>
            </tr>

            <tr>
                <td>Occupation:</td>
                <td>
                    <select name="occupation">
                        <option selected>Select one</option>
                        <option>Student</option>
                        <option>Employee</option>
                        <option>Business</option>
                        <option>Other</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Want us to send you junk emails?</td>
                <td>
                    <input type="radio"
                           name="junk"
                           value="absolutely">
                    Absolutely

                    <input type="radio"
                           name="junk"
                           value="no">
                    No way man
                </td>
            </tr>

            <tr>
                <td>
                    <input type="submit" value="Submit">
                </td>

                <td>
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>

    </form>


    <br>
    <hr>
    <br>


    <h1>Online Registration</h1>

    <form>

        <table>

            <tr>
                <td>Username:</td>
                <td>
                    <input type="text"
                           name="username"
                           placeholder="Enter username"
                           required>
                </td>
            </tr>

            <tr>
                <td>Password:</td>
                <td>
                    <input type="password"
                           name="password"
                           placeholder="Enter password"
                           required>
                </td>
            </tr>

            <tr>
                <td>Confirm Password:</td>
                <td>
                    <input type="password"
                           name="confirmPassword"
                           placeholder="Confirm password"
                           required>
                </td>
            </tr>

            <tr>
                <td>Name:</td>
                <td>
                    <input type="text"
                           name="name"
                           placeholder="Enter your name"
                           required>
                </td>
            </tr>

            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio"
                           name="gender"
                           value="male">
                    Male

                    <input type="radio"
                           name="gender"
                           value="female">
                    Female
                </td>
            </tr>

            <tr>
                <td>Address:</td>
                <td>
                    <textarea name="address"
                              rows="5"
                              cols="30"
                              placeholder="Enter your address"
                              required></textarea>
                </td>
            </tr>

            <tr>
                <td>Profession:</td>
                <td>
                    <select name="profession" required>
                        <option value="" selected>Select one</option>
                        <option>Student</option>
                        <option>Software Engineer</option>
                        <option>Teacher</option>
                        <option>Doctor</option>
                        <option>Other</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>
                    <input type="submit" value="Register">
                </td>

                <td>
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>

    </form>

</body>
</html>
