<!DOCTYPE html>
<html>
<head>
    <title>Request Parameters</title>
</head>

<body>

    <h1>Request Parameters</h1>

    <form action="parameters" method="post">

        Name:
        <input type="text" name="name">
        <br><br>

        Password:
        <input type="password" name="password">
        <br><br>

        Gender:
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>

        Interests:
        <input type="checkbox" name="interest" value="Java"> Java
        <input type="checkbox" name="interest" value="HTML"> HTML
        <input type="checkbox" name="interest" value="CSS"> CSS
        <br><br>

        Country:
        <select name="country">
            <option value="India">India</option>
            <option value="USA">USA</option>
            <option value="UK">UK</option>
        </select>
        <br><br>

        Address:
        <br>
        <textarea name="address" rows="4" cols="30"></textarea>
        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
